services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memoryassist
      POSTGRES_USER: memoryassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - memoryassist-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryassist -d memoryassist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memoryassist-postgres:
